name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m llm_proxify --version
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose --env-file .env.example config
        env:
          PROXY_API_KEYS: ci-test-token
      - run: docker build -t llm-proxify:ci .
      - name: Smoke test container, health, authentication and shutdown
        shell: bash
        run: |
          docker run -d --name proxy -p 127.0.0.1:8090:8090 \
            -e LLAMA_BACKENDS=http://127.0.0.1:1/v1 \
            -e PROXY_API_KEYS=ci-test-token llm-proxify:ci
          trap 'docker rm -f proxy' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8090/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/v1/models)" = 401
          curl -fsS -H 'Authorization: Bearer ci-test-token' http://127.0.0.1:8090/health
          docker stop -t 15 proxy
          test "$(docker inspect -f '{{.State.ExitCode}}' proxy)" = 0
