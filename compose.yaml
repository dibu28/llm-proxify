services:
  proxy:
    build: .
    image: llm-proxify:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      LLAMA_BACKENDS: ${LLAMA_BACKENDS:?Set LLAMA_BACKENDS in .env}
      PROXY_API_KEYS: ${PROXY_API_KEYS:?Set PROXY_API_KEYS in .env}
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
      PROXY_LOG_LEVEL: ${PROXY_LOG_LEVEL:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
